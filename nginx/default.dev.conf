server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Development: never cache UI/API responses. This removes the need for manual browser cache clearing.
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/docs {
        proxy_pass http://api:8000/api/docs;
        proxy_set_header Host $host;
    }

    location /api/openapi.json {
        proxy_pass http://api:8000/api/openapi.json;
        proxy_set_header Host $host;
    }

    # Vite dev server + HMR websocket support.
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

