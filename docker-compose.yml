services:
  postgres:
    image: postgres:16-alpine
    container_name: mch_postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mch_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mch_minio
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: mch_api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --reload
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./frontend/src/assets:/app/frontend_assets:ro
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    container_name: mch_worker
    env_file: .env
    depends_on:
      - api
      - redis
      - minio
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - ./backend:/app
      - ./frontend/src/assets:/app/frontend_assets:ro
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    container_name: mch_scheduler
    env_file: .env
    depends_on:
      - api
      - redis
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    volumes:
      - ./backend:/app
      - ./frontend/src/assets:/app/frontend_assets:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mch_frontend
    volumes:
    - ./frontend:/app
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mch_nginx
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      # Configure certs before enabling 443 in production.
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
