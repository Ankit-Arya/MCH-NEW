  #     CHOKIDAR_USEPOLLING: "true"
  #     WATCHPACK_POLLING: "true"

  nginx:
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  frontend_node_modules:
