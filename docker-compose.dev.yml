# Development override.
# Docker Compose automatically reads this file together with docker-compose.yml.
# It switches frontend to Vite dev server and backend to uvicorn --reload.
# Result: most UI/backend code changes appear after save or after restarting only that service.
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --reload
    volumes:
      - ./backend:/app
    environment:
      PYTHONUNBUFFERED: "1"

  worker:
    volumes:
      - ./backend:/app

  scheduler:
    volumes:
      - ./backend:/app

